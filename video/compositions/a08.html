    const tl = gsap.timeline({ paused: true });
    const IN = (t, at, o = {}) => tl.fromTo(t, { opacity: 0, y: 16, filter: "blur(6px)", ...o.from },

      tl.set(sel, { clipPath: "none" }, at + 0.56);
      const em = document.querySelector(sel).querySelectorAll("em");
      if (em.length) tl.to(em, { backgroundSize: "100% 100%", duration: 0.5, ease: "power2.out" }, at + 0.45);
    };
    // ✕ の印: 回りながら弾んで出て、小さく震える

      tl.fromTo(sel, { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2.5)" }, at);

      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.05 }, at);
      tl.to(sel, { attr: { x2, y2 }, duration: d, ease }, at);
    };
    // 輪が広がって消える（届いた・立ったの合図）

    // 人が店の前に集まる
    const box = document.querySelector("#a08-crowd");
    const from = [[-300, 0], [-500, 0], [2200, 0], [2400, 0], [-700, 0], [2600, 0], [-900, 0], [2800, 0]];
    from.forEach(([fx], i) => {
      const d = document.createElement("div");
      d.className = "a08-p";
      const x = 730 + i * 62;

      box.appendChild(d);
      tl.fromTo(d, { x: fx - x, opacity: 0 }, { x: 0, opacity: 1, duration: 1.6, ease: "power2.out" }, 2.0 + i * 0.12);
    });
    // 集まったところに「？」が立ち、地の下に地図が浮かぶ
    tl.fromTo("#a08-q", { y: -80, scale: 0.2, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "bounce.out" }, 4.4);
    RING("#a08-ring", 4.9);

    // 引くと、同じ地図に公式の緑のピンが先に立っている（1つの地図にまとまる）
    tl.to("#a08-world, #a08-scene", { scale: 0.6, transformOrigin: "960px 380px", duration: 1.0, ease: "power2.inOut" }, 4.9);
    tl.to(".gpin", { scale: 1.2, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.08 }, 6.0);
    CAP(".cap p:nth-child(1)", 2.4);
    CAP(".cap p:nth-child(2)", 5.4);
    // A09 へ: 店とピンが中央の丸い札に縮む
    OUT(".cap, #a08-owner, #a08-world", 7.3, 0.35);
    tl.to("#a08-disc", { scale: 1, duration: 0.5, ease: "expo.out" }, 7.3);
    tl.to("#a08-scene", { scale: 0.4, x: 0, y: 80, transformOrigin: "960px 380px", duration: 0.7, ease: "power3.inOut" }, 7.3);
