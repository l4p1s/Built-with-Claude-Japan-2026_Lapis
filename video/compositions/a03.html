  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = (t, at, o = {}) => tl.fromTo(t, { opacity: 0, y: 16, filter: "blur(6px)", ...o.from },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: o.stagger ?? 0, ...o.to }, at);
    const OUT = (t, at, d = 0.4) => tl.to(t, { opacity: 0, duration: d, ease: "power2.in" }, at);
    const POP = (t, at, stagger = 0) => tl.fromTo(t, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)", stagger }, at);
    // テロップ: 左から拭って出し、少し遅れて大事な語にマーカーを引く
    const CAP = (sel, at) => {
      tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0% round 18px)", x: -18 }, { clipPath: "inset(0% 0% 0% 0% round 18px)", x: 0, duration: 0.55, ease: "power3.out" }, at);
      tl.set(sel, { clipPath: "none" }, at + 0.56);
      const em = document.querySelector(sel).querySelectorAll("em");
      if (em.length) tl.to(em, { backgroundSize: "100% 100%", duration: 0.5, ease: "power2.out" }, at + 0.45);
    };
    // ✕ の印: 回りながら弾んで出て、小さく震える
    const NOX = (sel, at) => {
      tl.fromTo(sel, { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2.5)" }, at);
      tl.to(sel, { x: "+=7", duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, at + 0.5);
    };
    // 点線を (x1,y1) から (x2,y2) まで伸ばす（長さ 0 の線も丸い端で点が出るので、伸ばし始めるまで隠す）
    const DRAW = (sel, at, d, x2, y2, ease = "power2.out") => {
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.05 }, at);
      tl.to(sel, { attr: { x2, y2 }, duration: d, ease }, at);
    };
    // 輪が広がって消える（届いた・立ったの合図）
    const RING = (sel, at) => tl.fromTo(sel, { scale: 0.3, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, at);

    gsap.set("#a03-names", { xPercent: -50, yPercent: -50 });
    // 公式の給水拠点 79 か所を 10 列の格子に並べる（位置は実際の場所ではない）
    const grid = document.querySelector("#a03-grid");
    const dots = [];
    for (let i = 0; i < 79; i++) {
      const d = document.createElement("div");
      d.className = "a03-dot";
      d.style.left = `${160 + (i % 10) * 56}px`;
      d.style.top = `${350 + Math.floor(i / 10) * 46}px`;
      grid.appendChild(d);
      dots.push(d);
    }
    IN("#a03-label", 0.2);
    IN("#a03-num", 0.4);
    dots.forEach((d, i) => tl.fromTo(d, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.6 + i * 0.02));
    const n = { v: 0 };
    tl.fromTo(n, { v: 0 }, { v: 79, duration: 1.7, ease: "power1.inOut", onUpdate: () => {
      document.querySelector("#a03-n").textContent = Math.round(n.v);
    } }, 0.6);
    const wins = document.querySelectorAll(".a03-win");
    tl.fromTo(wins, { y: -40, opacity: 0, rotation: (i) => [-4, 3, -2, 5, 3, -5, 2, -3][i] }, { y: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2)", stagger: 0.08 }, 2.8);
    // 点が弧を描いて窓へ吸い込まれる（窓ごとの数は出典にないので、窓の中には残さない）
    dots.forEach((d, i) => {
      const w = i % 8, r = Math.floor(w / 4), c = w % 4;
      const tx = 900 + c * 220 + 100 - (160 + (i % 10) * 56 + 11);
      const ty = 210 + r * 204 + 105 - (350 + Math.floor(i / 10) * 46 + 11);
      const at = 3.7 + i * 0.022;
      tl.to(d, { x: tx, duration: 0.6, ease: "power1.in" }, at);
      tl.to(d, { y: ty, duration: 0.6, ease: "back.in(1.4)" }, at);
      tl.to(d, { scale: 0.3, opacity: 0, duration: 0.2, ease: "power1.in" }, at + 0.42);
    });
    // 窓が受け取るたびに、小さく揺れる
    tl.fromTo(wins, { scale: 1 }, { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, stagger: 0.25, ease: "power1.out" }, 4.2);
    tl.fromTo("#a03-sites", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 5.8);
    tl.fromTo("#a03-sites b", { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(3)", transformOrigin: "50% 70%" }, 5.8);
    tl.fromTo(".a03-win .bar em", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "expo.out", stagger: 0.06 }, 6.6);
    POP("#a03-names", 7.2);
    tl.fromTo("#a03-names b", { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(3)", transformOrigin: "50% 70%" }, 7.4);
    CAP(".cap p:nth-child(1)", 1.0);
    CAP(".cap p:nth-child(2)", 5.6);
    // A04 へ: 窓が左に寄って重なり、1 枚のリストになる
    OUT("#a03-label, #a03-num, #a03-sites, #a03-names, .cap, .src", 9.2, 0.4);
    wins.forEach((w, i) => {
      const r = Math.floor(i / 4), c = i % 4;
      tl.to(w, { x: 480 - (900 + c * 220 + 100) + i * 4, y: 495 - (210 + r * 204 + 90) + i * 4, scale: 1.3, duration: 0.8, ease: "power3.inOut" }, 9.0 + i * 0.02);
    });

    window.__timelines["a03"] = tl;
  </script>
