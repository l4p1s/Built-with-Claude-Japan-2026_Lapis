  <div id="root" data-composition-id="s15" data-width="1920" data-height="1080">
    <div id="s15-phone" class="phone"><video id="s15-video" class="clip" data-start="0" data-duration="10" data-media-start="6" muted playsinline src="assets/demo/D2.mp4"></video></div>
    <div id="s15-side" class="abs" style="left: 860px; top: 200px; width: 900px;">
      <div class="clock"><small>7月29日（地震の翌日）</small><span id="s15-clock">8:00</span></div>
      <div style="margin-top: 72px;">
      <p class="lead" style="font-size: 56px;">人が集まると、</p>
      <p class="lead" style="font-size: 56px;">自動で「<span class="accent">？</span>」が立つ。</p>

  <script>
    const tl = gsap.timeline({ paused: true });

    const IN = (t, at, o = {}) => tl.fromTo(t, { opacity: 0, filter: "blur(8px)", ...o.from },
      { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: o.stagger ?? 0, ...o.to }, at);
    const POP = (t, at, stagger = 0) => tl.fromTo(t, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)", stagger }, at);
    // デモの時刻（分）を [秒, 分] の折れ線から出して時計に書く（scripts/capture-demo.js の keys と同じ）
    const CLOCK = (sel, keys, dur) => {
      const el = document.querySelector(sel);
      const at = (s) => {
        for (let i = 1; i < keys.length; i++) {
          const [s0, t0] = keys[i - 1], [s1, t1] = keys[i];
          if (s <= s1) return t0 + ((t1 - t0) * (s - s0)) / (s1 - s0);
        }
        return keys[keys.length - 1][1];
      };
      const o = { s: 0 };
      tl.fromTo(o, { s: 0 }, { s: dur, duration: dur, ease: "none", onUpdate: () => {
        const m = Math.floor(at(o.s));
        el.textContent = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
      } }, 0);
    };

    CLOCK("#s15-clock", [[0, 480], [8.5, 530], [10, 530.5]], 10);
    IN("#s15-side .lead:nth-child(1)", 0.5);
    IN("#s15-side .lead:nth-child(2)", 6.8);

    window.__timelines["s15"] = tl;
  </script>
