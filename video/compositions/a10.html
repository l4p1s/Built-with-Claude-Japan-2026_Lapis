  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = (t, at, o = {}) => tl.fromTo(t, { opacity: 0, y: 16, filter: "blur(6px)", ...o.from },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: o.stagger ?? 0, ...o.to }, at);
    const OUT = (t, at, d = 0.4) => tl.to(t, { opacity: 0, duration: d, ease: "power2.in" }, at);
    const POP = (t, at, stagger = 0) => tl.fromTo(t, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)", stagger }, at);
    // テロップ: 左から拭って出し、少し遅れて大事な語にマーカーを引く
    const CAP = (sel, at) => {
      tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0% round 18px)", x: -18 }, { clipPath: "inset(0% 0% 0% 0% round 18px)", x: 0, duration: 0.55, ease: "power3.out" }, at);
      tl.set(sel, { clipPath: "none" }, at + 0.56);
      const em = document.querySelector(sel).querySelectorAll("em");
      if (em.length) tl.to(em, { backgroundSize: "100% 100%", duration: 0.5, ease: "power2.out" }, at + 0.45);
    };
    // ✕ の印: 回りながら弾んで出て、小さく震える
    const NOX = (sel, at) => {
      tl.fromTo(sel, { scale: 0, rotation: -90, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2.5)" }, at);
      tl.to(sel, { x: "+=7", duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, at + 0.5);
    };
    // 点線を (x1,y1) から (x2,y2) まで伸ばす（長さ 0 の線も丸い端で点が出るので、伸ばし始めるまで隠す）
    const DRAW = (sel, at, d, x2, y2, ease = "power2.out") => {
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.05 }, at);
      tl.to(sel, { attr: { x2, y2 }, duration: d, ease }, at);
    };
    // 輪が広がって消える（届いた・立ったの合図）
    const RING = (sel, at) => tl.fromTo(sel, { scale: 0.3, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, at);

    tl.fromTo("#a10-map", { scale: 1 }, { scale: 1.05, duration: 6, ease: "none", transformOrigin: "960px 440px" }, 0);
    tl.to("#a10-veil", { opacity: 0.82, duration: 0.6, ease: "power1.inOut" }, 1.0);
    tl.fromTo("#a10-title span", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out", stagger: 0.35 }, 1.4);
    tl.fromTo("#a10-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 2.3);
    IN("#a10-sub", 2.6);
    POP("#a10-app b", 3.3);
    IN("#a10-app span", 3.7);
    tl.to("#a10-veil", { opacity: 1, duration: 0.6 }, 5.4);
    OUT("#a10-title, #a10-bar, #a10-sub, #a10-app, .credit", 5.4, 0.6);

    window.__timelines["a10"] = tl;
