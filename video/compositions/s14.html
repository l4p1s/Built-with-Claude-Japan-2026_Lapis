<template>
  <style>

  </style>
  <div id="root" data-composition-id="s14" data-width="1920" data-height="1080">
    <div id="s14-phone" class="phone"><video id="s14-video" class="clip" data-start="0" data-duration="6" data-media-start="0" muted playsinline src="assets/demo/D2.mp4"></video></div>
    <div id="s14-side" class="abs" style="left: 860px; top: 220px; width: 900px;">
      <div class="clock"><small>7月29日（地震の翌日）</small>8:00</div>
      <p class="lead" style="margin-top: 64px; font-size: 56px;">地震の翌日の八代市を、<br>早回しで再生する。</p>
      <p id="s14-note">八代市役所の周りに置いた 1,000人の合成データ。実際の人の動きではない</p>

  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    const IN = (t, at, o = {}) => tl.fromTo(t, { opacity: 0, filter: "blur(8px)", ...o.from },
      { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: o.stagger ?? 0, ...o.to }, at);
    const POP = (t, at, stagger = 0) => tl.fromTo(t, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)", stagger }, at);
    // デモの時刻（分）を [秒, 分] の折れ線から出して時計に書く（scripts/capture-demo.js の keys と同じ）
    const CLOCK = (sel, keys, dur) => {
      const el = document.querySelector(sel);
      const at = (s) => {
        for (let i = 1; i < keys.length; i++) {
          const [s0, t0] = keys[i - 1], [s1, t1] = keys[i];
          if (s <= s1) return t0 + ((t1 - t0) * (s - s0)) / (s1 - s0);
        }
        return keys[keys.length - 1][1];
      };
      const o = { s: 0 };
      tl.fromTo(o, { s: 0 }, { s: dur, duration: dur, ease: "none", onUpdate: () => {
        const m = Math.floor(at(o.s));
        el.textContent = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
      } }, 0);
    };

    tl.fromTo("#s14-phone", { x: -700 }, { x: 0, duration: 1.0, ease: "expo.out" }, 0);
    IN("#s14-side .clock", 0.6);
    IN("#s14-side .lead", 1.2);
    IN("#s14-note", 0.8);

    window.__timelines["s14"] = tl;
  </script>
