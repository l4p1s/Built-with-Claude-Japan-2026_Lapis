      let m = KEYS[KEYS.length - 1][1];
      for (let i = 1; i < KEYS.length; i++) {
        const [s0, t0] = KEYS[i - 1], [s1, t1] = KEYS[i];
        if (s <= s1) { m = t0 + ((t1 - t0) * (s - s0)) / (s1 - s0); break; }
      }
      m = Math.floor(m);
      document.querySelector("#clock").textContent = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
    } }, 0);

    // 見る場所を 1 つにする: 町の札を拡大して画面を薄く ↔ 画面の一部に寄って町の札を薄く
    const FOCUS_TOWN = (at, d = 0.8) => { tl.to("#town", { scale: 1.25, duration: d, ease: "power2.inOut", transformOrigin: "100% 0%" }, at); tl.to("#phone", { opacity: 0.35, duration: d }, at); };
    const UNFOCUS_TOWN = (at, d = 0.8) => { tl.to("#town", { scale: 1, duration: d, ease: "power2.inOut" }, at); tl.to("#phone", { opacity: 1, duration: d }, at); };
    const ZOOM = (at, origin, s = 1.55, d = 1.0) => { tl.to("#phone", { scale: s, duration: d, ease: "power2.inOut", transformOrigin: origin }, at); tl.to("#town", { opacity: 0.45, duration: d }, at); };
    const UNZOOM = (at, d = 0.9) => { tl.to("#phone", { scale: 1, duration: d, ease: "power2.inOut" }, at); tl.to("#town", { opacity: 1, duration: d }, at); };
    const BUZZ = (at) => {
      tl.to("#phone", { rotation: 1.2, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, at);
      tl.to("#tme svg rect", { x: 3, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, at);
    };

    gsap.set("#b04-ring, #tg-r, #tap", { opacity: 0 });
    // 1) 流れの 3 段: 公式は「聞く」をとばす。町の公式の拠点に緑の輪と「質問なし」
    tl.to("#st2", { opacity: 0.35, duration: 0.4 }, 0.2);
    const arc = document.querySelector("#b04-arc");
    const len = arc.getTotalLength();
    tl.fromTo(arc, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#b04-head", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.05);
    IN("#b04-skiplab", 1.0);
    RING("#tg-r", 0.3);
    IN("#tnoask", 0.5, { from: { x: 20, y: 0 }, to: { x: 0 } });
    CAP(".cap p:nth-child(1)", 0.9);
    // 2) 手元の画面の緑のピンに寄って押す（動画の 38 秒 = ここの 2 秒）
    ZOOM(1.0, "219px 295px", 1.5);
    tl.fromTo("#tap", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, 1.95);
    tl.to("#tap", { opacity: 0, duration: 0.3 }, 2.3);
    RING("#b04-ring", 2.1);
    tl.fromTo("#pl-g", { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 2.4);
    tl.to("#pl-g", { opacity: 0, duration: 0.3 }, 3.8);
    UNZOOM(4.0);
    // 3) 開いた下のシートを枠で示し、アプリの文を右に引いて見せる（シートは拡大しない。中の人数は合成データなので）
    tl.fromTo("#sheet", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 5.0);
    DRAW("#b04-ln", 5.3, 0.5, 735, 875);
    tl.fromTo("#b04-quote", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 5.5);
    CAP(".cap p:nth-child(2)", 7.4);
    // B05 へ: 画面を白にする
    OUT(".cap, #b04-quote, .dash, #b04-skip, #b04-skiplab, .steps, #tnoask, #sheet", 11.4, 0.35);
    tl.to("#scrw", { opacity: 1, duration: 0.4 }, 11.5);

    window.__timelines["b04"] = tl;
  </script>
</template>
