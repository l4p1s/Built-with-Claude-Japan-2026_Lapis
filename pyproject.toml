[project]
name = "aid-spot-finder"
version = "0.1.0"
description = "災害時、GPS の「いつもと違う集まり」から非公式な支援拠点を見つける"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "httpx2",
    "numpy",  # scripts/make_demo_data.py（合成の人流データ）
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff の版で既定が変わらないよう固定

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
