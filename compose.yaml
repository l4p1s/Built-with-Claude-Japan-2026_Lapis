services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-h", "127.0.0.1"]  # 初回の初期化中は TCP を受けないので、TCP で確認する
      interval: 2s
      retries: 30

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      AREA: ${AREA:-32.5072,130.6016,25000}  # 対象地域（lat,lon,半径 m）。既定は八代市役所から 25km。空にすると制限なし
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
