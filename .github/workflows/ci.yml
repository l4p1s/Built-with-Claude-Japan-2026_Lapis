name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      DETECT_EVERY_S: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: DB のスキーマを入れる
        run: uv run python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL'], autocommit=True).execute(open('db/init.sql').read())"
      - run: uv run ruff check .
      - run: uv run pytest -q
